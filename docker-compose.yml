services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controlsuite-backend-${ENV:-dev}
    env_file: ./backend/.env
    depends_on:
      - redis
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dev-api.controlsuitte.com}
    container_name: controlsuite-frontend-${ENV:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: always

  # Redis local para BullMQ (colas) + locks de idempotencia. Reemplaza a Upstash,
  # que reventaba el límite de 500k requests del plan free porque BullMQ pollea
  # Redis constantemente. Self-hosted no tiene ese tope.
  redis:
    image: redis:7-alpine
    container_name: controlsuite-redis-${ENV:-dev}
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always

volumes:
  redis-data:
