L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"/></svg> <div class=\"text-xs text-amber-800 flex-1\">La IA armó este reporte filtrando información interna (costos, márgenes, honorarios). <strong>Revisa antes de enviar al cliente final.</strong></div> </div> <!-- Reporte (preview tipo email) --> <div class=\"flex-1 overflow-y-auto bg-slate-100 p-6\"> <div class=\"bg-white max-w-2xl mx-auto shadow-sm\"> <!-- Header reporte --> <div class=\"bg-gradient-to-br from-indigo-600 to-cyan-500 text-white p-8\"> <div class=\"text-[11px] uppercase tracking-widest text-white/70 mb-2\">Reporte de activación</div> <h1 class=\"display-font text-3xl mb-1\">L'Oréal Primavera 2026</h1> <p class=\"text-white/90 text-sm\">Mall del Trébol · sábado 19 oct 2026 · 10:00–18:00</p> </div> <div class=\"p-8 space-y-8\"> <!-- Resumen ejecutivo --> <section> <h2 class=\"text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3\">Resumen ejecutivo</h2> <p class=\"text-sm leading-relaxed text-slate-700\">Activación ejecutada exitosamente con 8 promotoras en jornada completa, alcanzando un tráfico estimado de <strong>2.847 personas</strong> y la entrega de <strong>487 samples</strong> de la línea Hidra. Se cumplió el 100% del plan operativo sin incidencias mayores. La activación se desarrolló según lo planificado y el material POP completo se desplegó dentro del horario acordado.</p> </section> <!-- KPIs --> <section> <h2 class=\"text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3\">Métricas principales</h2> <div class=\"grid grid-cols-3 gap-3\"> <div class=\"border border-slate-200 rounded-lg p-4\"> <div class=\"text-3xl font-semibold\">2.847</div> <div class=\"text-xs text-slate-500 mt-1\">Tráfico al sector<br>(estimado)</div> </div> <div class=\"border border-slate-200 rounded-lg p-4\"> <div class=\"text-3xl font-semibold\">487</div> <div class=\"text-xs text-slate-500 mt-1\">Samples entregados<br>de 500 disponibles</div> </div> <div class=\"border border-slate-200 rounded-lg p-4\"> <div class=\"text-3xl font-semibold\">142</div> <div class=\"text-xs text-slate-500 mt-1\">Registros nuevos<br>base de datos</div> </div> <div class=\"border border-slate-200 rounded-lg p-4\"> <div class=\"text-3xl font-semibold\">98%</div> <div class=\"text-xs text-slate-500 mt-1\">Cobertura horaria<br>(7h 50min de 8h)</div> </div> <div class=\"border border-slate-200 rounded-lg p-4\"> <div class=\"text-3xl font-semibold\">100%</div> <div class=\"text-xs text-slate-500 mt-1\">Equipo asistencia<br>8/8 promotoras</div> </div> <div class=\"border border-slate-200 rounded-lg p-4\"> <div class=\"text-3xl font-semibold\">8.6/10</div> <div class=\"text-xs text-slate-500 mt-1\">Calidad del montaje<br>(eval interna)</div> </div> </div> </section> <!-- Ejecución --> <section> <h2 class=\"text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3\">Ejecución</h2> <div class=\"space-y-3 text-sm\"> <div class=\"flex gap-3\"> <div class=\"text-[10px] uppercase tracking-wider text-slate-400 font-semibold w-20 pt-1\">10:00</div> <div class=\"flex-1\"><strong>Inicio activación.</strong> Equipo completo de 8 promotoras en posición. Tótem L'Oréal, mesa de samples y banderolas instalados según mockup aprobado.</div> </div> <div class=\"flex gap-3\"> <div class=\"text-[10px] uppercase tracking-wider text-slate-400 font-semibold w-20 pt-1\">12:30</div> <div class=\"flex-1\"><strong>Reporte intermedio.</strong> 1.420 personas registradas en sector. 218 samples entregados. Tráfico mayor al esperado.</div> </div> <div class=\"flex gap-3\"> <div class=\"text-[10px] uppercase tracking-wider text-slate-400 font-semibold w-20 pt-1\">14:30</div> <div class=\"flex-1\"><strong>Refuerzo de samples.</strong> Se solicitó y entregó refuerzo de 200 unidades adicionales para mantener la dinámica.</div> </div> <div class=\"flex gap-3\"> <div class=\"text-[10px] uppercase tracking-wider text-slate-400 font-semibold w-20 pt-1\">17:50</div> <div class=\"flex-1\"><strong>Cierre activación.</strong> Material desmontado y embalado. Sin incidentes con el local.</div> </div> </div> </section> <!-- Galería --> <section> <h2 class=\"text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3\">Registro fotográfico</h2> <div class=\"grid grid-cols-3 gap-2\"> <div class=\"aspect-video rounded bg-gradient-to-br from-purple-300 to-pink-400 flex items-center justify-center text-white text-xs\">Montaje 9:45</div> <div class=\"aspect-video rounded bg-gradient-to-br from-pink-300 to-rose-400 flex items-center justify-center text-white text-xs\">Equipo 10:00</div> <div class=\"aspect-video rounded bg-gradient-to-br from-violet-300 to-purple-400 flex items-center justify-center text-white text-xs\">Stand 11:30</div> <div class=\"aspect-video rounded bg-gradient-to-br from-fuchsia-300 to-pink-400 flex items-center justify-center text-white text-xs\">Tráfico 13:00</div> <div class=\"aspect-video rounded bg-gradient-to-br from-rose-300 to-red-400 flex items-center justify-center text-white text-xs\">Samples 15:30</div> <div class=\"aspect-video rounded bg-gradient-to-br from-purple-300 to-violet-400 flex items-center justify-center text-white text-xs\">Cierre 17:50</div> </div> <div class=\"text-[11px] text-slate-500 mt-2\">23 fotos disponibles en alta resolución · adjuntas en el correo</div> </section> <!-- Observaciones --> <section> <h2 class=\"text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3\">Observaciones y recomendaciones</h2> <div class=\"space-y-2 text-sm text-slate-700\"> <p>• Tráfico superior al esperado en horario 12:00–14:00, sugerimos reforzar dotación en futuras activaciones similares.</p> <p>• La línea Hidra tuvo alta receptividad. Recomendamos destacarla en próximas campañas de la categoría.</p> <p>• Mall del Trébol presenta excelente flujo en zona central. Propuesta para campaña verano 2027 ya disponible.</p> </div> </section> <!-- Footer --> <div class=\"border-t border-slate-200 pt-6 text-xs text-slate-500\"> Reporte generado por Agencia Nexus BTL · 23 oct 2026 · contacto: maria@nexus-btl.cl · +56 9 8234 5612 </div> </div> </div> </div> <!-- Footer modal --> <div class=\"px-6 py-4 border-t border-slate-200 bg-white flex items-center justify-between\"> <div class=\"flex items-center gap-3\"> <input type=\"email\" class=\"input w-72\" value=\"gerente_btl@loreal.cl\" placeholder=\"Email destinatario\"> <span class=\"text-[11px] text-slate-500\">Adjuntos: reporte.pdf · 23 fotos.zip</span> </div> <div class=\"flex gap-2\"> <button class=\"btn-secondary\">Editar reporte</button> <button class=\"btn-secondary\">Descargar PDF</button> <button onclick=\"closeModal('modal-reporte-cliente')\" class=\"btn-primary\">Aprobar y enviar</button> </div> </div> </div> </div> </body> </html>"
