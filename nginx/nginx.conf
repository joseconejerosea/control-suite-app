events {
    worker_connections 1024;
}

http {
    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────
    server {
        listen 80;
        server_name dev.controlsuitte.com dev-api.controlsuitte.com
                    controlsuitte.com www.controlsuitte.com api.controlsuitte.com;
        return 301 https://$host$request_uri;
    }

    # ── Dev API (HTTPS) ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name dev-api.controlsuitte.com;

        ssl_certificate     /etc/letsencrypt/live/dev-api.controlsuitte.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev-api.controlsuitte.com/privkey.pem;

        client_max_body_size 50M;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # ── Dev frontend (HTTPS) ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name dev.controlsuitte.com;

        ssl_certificate     /etc/letsencrypt/live/dev.controlsuitte.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.controlsuitte.com/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Prod API (HTTPS) ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.controlsuitte.com;

        ssl_certificate     /etc/letsencrypt/live/api.controlsuitte.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.controlsuitte.com/privkey.pem;

        client_max_body_size 50M;

        location / {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # ── Prod frontend (HTTPS) ────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name controlsuitte.com www.controlsuitte.com;

        ssl_certificate     /etc/letsencrypt/live/controlsuitte.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/controlsuitte.com/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Fallback (IP directa → dev) ──────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
