services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controlsuite-backend-dev
    env_file: ./backend/.env.dev
    restart: always
    expose:
      - "3001"

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controlsuite-backend-prod
    env_file: ./backend/.env.prod
    restart: always
    expose:
      - "3002"
    environment:
      - PORT=3002

  nginx:
    image: nginx:alpine
    container_name: controlsuite-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend-dev
      - backend-prod
    restart: always
