# Local testing override (safe to delete). Full-local stack: dockerized backend
# pointed at a LOCAL empty Postgres, CORS opened for the locally-served frontend.
services:
  backend:
    depends_on:
      - redis
      - postgres
    environment:
      ALLOWED_ORIGIN: "http://localhost:3000"
      NODE_ENV: "development"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "controlsuite"
      DB_SSL: "false"
      DB_SYSTEM_USERNAME: "postgres"
      DB_SYSTEM_PASSWORD: "postgres"
      DB_MIGRATION_USERNAME: "postgres"
      DB_MIGRATION_PASSWORD: "postgres"

  postgres:
    image: postgres:15-alpine
    container_name: controlsuite-postgres-dev
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "controlsuite"
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always

volumes:
  pg-data:
