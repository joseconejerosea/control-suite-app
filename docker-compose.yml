services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controlsuite-backend-${ENV:-dev}
    env_file: ./backend/.env
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dev-api.controlsuitte.com}
    container_name: controlsuite-frontend-${ENV:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: always
