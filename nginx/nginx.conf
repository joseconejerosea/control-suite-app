events {
    worker_connections 1024;
}

http {
    # ── Dev backend ──────────────────────────────────────────────────────
    upstream backend_dev {
        server backend-dev:3001;
    }

    # ── Prod backend ─────────────────────────────────────────────────────
    upstream backend_prod {
        server backend-prod:3002;
    }

    # ── dev-api (HTTP por ahora, SSL despues) ────────────────────────────
    server {
        listen 80;
        server_name dev-api.controlsuite.cl;

        client_max_body_size 50M;

        location / {
            proxy_pass http://backend_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # ── api (HTTP por ahora, SSL despues) ────────────────────────────────
    server {
        listen 80;
        server_name api.controlsuite.cl;

        client_max_body_size 50M;

        location / {
            proxy_pass http://backend_prod;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }

    # ── Fallback (IP directa, apunta a dev) ──────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 50M;

        location / {
            proxy_pass http://backend_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
